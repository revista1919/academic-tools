<!-- math.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <!-- same -->
</head>
<body>
    <!-- header same -->
    <main>
        <section>
            <h2>Render LaTeX</h2>
            <textarea id="latex-input" placeholder="LaTeX..."></textarea>
            <div id="latex-output"></div>
        </section>
        <section>
            <h2>Fórmula a Imagen</h2>
            <button id="formula-to-image">Generar</button>
            <canvas id="formula-canvas" style="display:none"></canvas>
            <a id="download-image" style="display:none">Descargar</a>
        </section>
        <section>
            <h2>Editor Ecuaciones</h2>
            <input id="equation-editor" placeholder="Ecuación...">
            <button id="insert-symbol">Insertar</button>
            <select id="symbol-select"><!-- same --></select>
            <div id="equation-preview"></div>
        </section>
        <section>
            <h2>Importar Fórmula desde Imagen (OCR)</h2>
            <input type="file" id="ocr-input" accept="image/*">
            <button id="ocr-formula">OCR Fórmula</button>
        </section>
        <section>
            <h2>Conversor Unidades</h2>
            <!-- same -->
        </section>
    </main>
    <footer><!-- same --></footer>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.4/dist/katex.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <script src="app.js"></script>
    <script src="tools/math.js"></script>
</body>
</html>
