<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor LaTeX Académico - Academic Tools</title>
    <link rel="stylesheet" href="styles.css">

    <!-- CSS de CodeMirror (versión estable y sin redirects) -->
    <link rel="stylesheet" href="https://unpkg.com/@codemirror/theme-one-dark@6.1.2/dist/index.css">
    <link rel="stylesheet" href="https://unpkg.com/@codemirror/view@6.23.0/dist/index.css">

    <!-- Importmap con versiones que EXISTEN y funcionan al 100% -->
    <script type="importmap">
    {
      "imports": {
        "@codemirror/state": "https://unpkg.com/@codemirror/state@6.4.1/dist/index.js",
        "@codemirror/view": "https://unpkg.com/@codemirror/view@6.23.0/dist/index.js",
        "@codemirror/commands": "https://unpkg.com/@codemirror/commands@6.3.3/dist/index.js",
        "@codemirror/language": "https://unpkg.com/@codemirror/language@6.10.0/dist/index.js",
        "@codemirror/autocomplete": "https://unpkg.com/@codemirror/autocomplete@6.18.0/dist/index.js",
        "@codemirror/lint": "https://unpkg.com/@codemirror/lint@6.5.0/dist/index.js",

        "codemirror-lang-latex": "https://unpkg.com/@codemirror/lang-latex@6.1.1/dist/index.js",
        "@codemirror/lang-markdown": "https://unpkg.com/@codemirror/lang-markdown@6.2.4/dist/index.js",

        "@lezer/common": "https://unpkg.com/@lezer/common@1.2.1/dist/index.js",
        "@lezer/highlight": "https://unpkg.com/@lezer/highlight@1.2.0/dist/index.js",
        "@lezer/lr": "https://unpkg.com/@lezer/lr@1.4.0/dist/index.js"
      }
    }
    </script>

    <style>
        body { font-family: system-ui, sans-serif; margin: 0; padding: 20px; background: #f9f9f9; }
        .dark { background: #1e1e1e; color: #fff; }
        .editor-container {
            border: 1px solid #ccc;
            height: 450px;
            margin: 15px 0;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .dark .editor-container { background: #1e1e1e !important; }
        .sidebar { 
            width: 220px; 
            float: left; 
            background: #f0f0f0; 
            padding: 15px; 
            height: 450px; 
            overflow-y: auto;
            border-right: 1px solid #ddd;
        }
        .dark .sidebar { background: #2d2d2d; }
        .sidebar-item { padding: 6px 0 6px 10px; cursor: pointer; border-left: 3px solid transparent; }
        .sidebar-item:hover { background: #e0e0e0; border-left-color: #007acc; }
        .dark .sidebar-item:hover { background: #3d3d3d; }
        button, select, input { margin: 5px; padding: 8px 12px; }
        iframe { width: 100%; height: 600px; border: 1px solid #ccc; display: none; }
    </style>
</head>
<body>

    <!-- Todo tu HTML igual que antes -->
    <h1>Editor LaTeX Académico Gratuito</h1>
    <button id="dark-mode-toggle">Modo Oscuro</button>

    <select id="template-select">
        <option value="APA">APA</option>
        <option value="Chicago">Chicago</option>
        <option value="IEEE">IEEE</option>
        <option value="Springer">Springer</option>
        <option value="Elsevier">Elsevier</option>
        <option value="Tesis Chilena">Tesis Chilena</option>
    </select>
    <button id="generate-structure">Generar Estructura</button>

    <div style="clear:both"></div>

    <h2>Preamble</h2>
    <div id="preamble-editor" class="editor-container"></div>

    <h2>Documento Principal</h2>
    <div style="display:flex;">
        <div id="sidebar" class="sidebar"></div>
        <div style="flex:1;">
            <div id="main-editor" class="editor-container"></div>
        </div>
    </div>

    <h2>BibTeX</h2>
    <div id="bib-editor" class="editor-container"></div>

    <button id="compile-pdf">Compilar PDF</button>
    <iframe id="pdf-preview"></iframe>

    <!-- Tus otros botones aquí (insertar sección, figura, etc.) -->

    <!-- Scripts externos -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="https://manuels.github.io/texlive.js/dist/texlive.js"></script>

    <!-- NUESTRO JS (con todos los logs) -->
    <script type="module" src="tools/text.js"></script> -->
    <script type="module" src="tools/text.js"></script>
</body>
</html>
